<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>U. Trade - La plateforme d'échange étudiante</title>
    <meta name="description" content="La plateforme d'achat, vente et services entre étudiants." />

    <!-- Open Graph — aperçu de partage (WhatsApp, Facebook, LinkedIn, Messenger...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="U. Trade" />
    <meta property="og:title" content="U. Trade" />
    <meta property="og:description" content="La plateforme d'achat, vente et services entre étudiants." />
    <!-- ⚠️ À remplacer par le vrai domaine une fois déployé (ex: https://utrade.app) -->
    <meta property="og:url" content="https://votre-domaine-a-completer.example" />
    <!-- L'URL doit être absolue (https://...), pas relative (/og-image.png) —
         WhatsApp et la plupart des plateformes ignorent silencieusement une
         image en chemin relatif. À ajuster une fois le domaine connu. -->
    <meta property="og:image" content="https://votre-domaine-a-completer.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="U. Trade" />
    <meta name="twitter:description" content="La plateforme d'achat, vente et services entre étudiants." />
    <meta name="twitter:image" content="https://votre-domaine-a-completer.example/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
